<!DOCTYPE html>
<html>
<head>
    <title>rắn ăn táo</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #2c3e50; color: white; overflow: hidden; }
        /* Đổi nền sân chơi thành màu cỏ xanh, thêm bo góc cho đẹp */
        canvas { border: 4px solid #ecf0f1; background: #a2d149; margin-top: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); touch-action: none; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>rắn ăn táo</h1>
    <h2 id="scoreText">Điểm: 0</h2>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Dùng mũi tên (PC) hoặc vuốt màn hình (Mobile). <b>Nhấn SPACE để bắt đầu!</b></p>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreText = document.getElementById("scoreText");
        const CELL_SIZE = 20; 

        // Cài đặt phông chữ để vẽ Emoji vừa vặn vào ô 20px
        ctx.font = "20px Arial";
        ctx.textBaseline = "top"; 

        const socket = new WebSocket("wss://ran-test.onrender.com");

        socket.onopen = () => { console.log("Đã kết nối máy chủ!"); };

        socket.onmessage = (event) => {
            const state = JSON.parse(event.data);
            
            if (state.status === "gameover") {
                scoreText.innerText = "GAME OVER! Đợi 1 tí để chơi lại...";
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Thêm icon đầu lâu khi thua
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.fillText("💀 THUA RỒI 💀", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left"; // Trả lại căn lề mặc định
                return;
            }
            
            scoreText.innerText = "Điểm: " + state.score;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Vẽ táo bằng Emoji 🍎 thay vì ô vuông màu đỏ
            ctx.fillText("🍎", state.apple.x * CELL_SIZE, state.apple.y * CELL_SIZE);
            
            // Vẽ rắn bằng Emoji
            for (let i = 0; i < state.snake.length; i++) {
                let x = state.snake[i].x * CELL_SIZE;
                let y = state.snake[i].y * CELL_SIZE;
                
                if (i === 0) {
                    // Vẽ cái đầu rắn 🐍 ở vị trí đầu tiên
                    ctx.fillText("🐍", x, y);
                } else {
                    // Vẽ các đốt thân rắn 🟢 ở phía sau
                    ctx.fillText("🟢", x, y);
                }
            }

            if (state.status === "waiting") {
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "white"; 
                ctx.textAlign = "center";
                ctx.fillText("Nhấn SPACE (hoặc chạm) để bắt đầu", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            }
        };

        document.addEventListener("keydown", (e) => {
            let action = null;
            if (e.code === "Space") action = "start"; 
            if (e.key === "ArrowUp") action = "up";
            if (e.key === "ArrowDown") action = "down";
            if (e.key === "ArrowLeft") action = "left";
            if (e.key === "ArrowRight") action = "right";
            if (action) socket.send(JSON.stringify({ action: action }));
        });

        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            socket.send(JSON.stringify({ action: "start" }));
        }, false);

        canvas.addEventListener('touchend', function(e) {
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;
            
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return; 
            
            let action = null;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) action = "right"; else action = "left";
            } else {
                if (dy > 0) action = "down"; else action = "up";
            }
            if (action) socket.send(JSON.stringify({ action: action }));
        }, false);
    </script>
</body>
</html>
